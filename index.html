<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --accent:  #4fa8d8;   /* sky blue */
      --accent2: #7bc4a0;   /* mint green */
      --bg:      #f0f7fb;   /* light sky */
      --surface: #ffffff;
      --border:  #d4e8f5;
      --text:    #334e5e;
      --muted:   #8aabbe;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic ProN', sans-serif; }

    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg, #e8f6ff, #d0edf8);
      border-bottom: 2px solid var(--accent);
      padding: 14px 20px;
    }
    .app-header h1 { font-size: 1.15rem; color: var(--accent); letter-spacing: 3px; margin: 0; }
    .mode-btn {
      padding: 5px 18px; border: 1.5px solid var(--accent); border-radius: 20px;
      background: transparent; color: var(--accent); font-size: 0.8rem; cursor: pointer; transition: all .2s;
    }
    .mode-btn.active { background: var(--accent); color: #fff; }

    /* ── Controls ── */
    .ctrl-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; }
    .app-select {
      width: 100%; padding: 9px 14px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.95rem; appearance: none; cursor: pointer;
      box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .app-select:focus { outline: none; border-color: var(--accent); }
    .date-arrow {
      width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border); color: var(--muted);
      font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s; box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .date-arrow:hover { border-color: var(--accent); color: var(--accent); }
    .date-display {
      flex: 1; padding: 9px 14px; text-align: center;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; color: var(--text); cursor: pointer; user-select: none;
      box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .date-display:hover { border-color: var(--accent); }
    #date-select { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

    /* ── Tag filter ── */
    .section-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
    .tag-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .filter-tag {
      font-size: 0.75rem; padding: 4px 13px; border-radius: 12px;
      background: transparent; border: 1.5px solid var(--border); color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .filter-tag:hover { border-color: var(--accent); color: var(--accent); }
    .filter-tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Staff card (guest) ── */
    .staff-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
      overflow: hidden; text-align: center; height: 100%;
      box-shadow: 0 2px 10px rgba(79,168,216,.10);
    }
    .staff-card img {
      width: 100%; aspect-ratio: 3/5; object-fit: cover; object-position: top; display: block;
    }
    .staff-card .img-wrap { position: relative; display: block; }
    .staff-card .img-wrap.has-url { cursor: pointer; }
    .staff-card .img-wrap.has-url::after {
      content: '詳細 ›';
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(79,168,216,.82); color: #fff;
      font-size: 0.72rem; letter-spacing: 1px; text-align: center;
      padding: 5px 0;
      opacity: 0; transition: opacity .2s;
    }
    .staff-card .img-wrap.has-url:hover::after { opacity: 1; }
    .staff-card .s-name { padding: 8px 6px 3px; font-size: 0.88rem; color: var(--text); letter-spacing: 1px; font-weight: 600; }
    .staff-card .s-stats {
      font-size: 0.62rem; color: var(--muted); padding: 0 6px 4px;
      display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
    }
    .staff-card .s-tags { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; padding: 0 6px 10px; }

    /* ── Staff row (admin) ── */
    .staff-row {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; padding: 10px 14px; gap: 12px;
      cursor: pointer; transition: all .2s; height: 100%;
      box-shadow: 0 1px 6px rgba(79,168,216,.08);
    }
    .staff-row.selected { border-color: var(--accent); background: #e8f6ff; }
    .staff-row img { width: 44px; height: 74px; object-fit: cover; object-position: top; border-radius: 8px; flex-shrink: 0; }
    .staff-row .r-info { flex: 1; min-width: 0; }
    .staff-row .r-name { font-size: 0.9rem; margin-bottom: 4px; color: var(--text); font-weight: 600; }
    .staff-row .check {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all .2s;
    }
    .staff-row.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Tags ── */
    .tag {
      font-size: 0.62rem; padding: 2px 7px; border-radius: 10px;
      background: rgba(123,196,160,.15); border: 1px solid rgba(123,196,160,.5); color: #3d9e76;
    }
    .r-tags { display: flex; flex-wrap: wrap; gap: 3px; }

    /* ── Misc ── */
    .update-btn {
      width: 100%; padding: 13px; margin-top: 16px;
      background: linear-gradient(135deg, var(--accent), #2d8abf);
      border: none; border-radius: 10px; color: #fff; font-size: 1rem;
      cursor: pointer; letter-spacing: 2px; transition: opacity .2s;
      box-shadow: 0 3px 12px rgba(79,168,216,.35);
    }
    .update-btn:hover { opacity: .88; }
    .no-staff { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem; }
    .toast-wrap {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: #fff; padding: 11px 26px; border-radius: 24px;
      font-size: 0.9rem; transition: transform .3s; pointer-events: none; z-index: 9999;
      box-shadow: 0 4px 16px rgba(79,168,216,.4);
    }
    .toast-wrap.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Header -->
<div class="app-header d-flex align-items-center justify-content-between">
  <h1>✦ 出勤情報</h1>
  <div class="d-flex gap-2">
    <button class="mode-btn active" id="btn-guest" onclick="setMode('guest')">客用</button>
    <button class="mode-btn"        id="btn-admin" onclick="setMode('admin')">管理者</button>
  </div>
</div>

<!-- Controls -->
<div class="container-lg py-4 px-3 px-md-4">
  <div class="row g-3 mb-3">
    <!-- Shop -->
    <div class="col-12 col-md-4">
      <div class="ctrl-label">SHOP</div>
      <select class="app-select" id="shop-select" onchange="selectedTags=new Set();render()">
        <option value="1">銀座店</option>
        <option value="2">六本木店</option>
        <option value="3">赤坂店</option>
      </select>
    </div>
    <!-- Date -->
    <div class="col-12 col-md-8">
      <div class="ctrl-label">DATE</div>
      <div class="d-flex align-items-center gap-2">
        <button class="date-arrow" onclick="shiftDate(-1)">‹</button>
        <div class="date-display" onclick="openDatePicker()" id="date-display"></div>
        <button class="date-arrow" onclick="shiftDate(1)">›</button>
      </div>
      <input type="date" id="date-select" onchange="onDatePicked()">
    </div>
  </div>

  <!-- Guest view -->
  <div id="view-guest">
    <div class="section-label">本日出勤</div>
    <div class="tag-filter" id="tag-filter"></div>
    <div class="row g-3" id="guest-grid"></div>
  </div>

  <!-- Admin view -->
  <div id="view-admin" style="display:none">
    <div class="section-label">出勤スタッフ選択</div>
    <div class="row g-3" id="admin-list"></div>
    <button class="update-btn" onclick="saveSchedule()">更　新</button>
  </div>
</div>

<div class="toast-wrap" id="toast">更新しました</div>

<script>
// ── Staff data ────────────────────────────────────────────────
const staff = [
  { id:1, name:'田中花子',  img:'panels/田中花子.png',  tags:['読書','カフェ巡り','映画','キャンプ','ショッピング'], height:158, bust:85, waist:58, hip:86, url:'https://www.pokepara.jp/_hokkaido/m801/a1801/shop4072/gal/409983/' },
  { id:2, name:'佐藤あかり',img:'panels/佐藤あかり.png',tags:['ヨガ','ネイル','ドライブ','映画','ショッピング'],  height:163, bust:82, waist:55, hip:83, url:'https://www.jfa.jp/national_team/staff/MORIYASU_Hajime.html' },
  { id:3, name:'渡辺咲良',  img:'panels/渡辺咲良.png',  tags:['料理','K-POP','ショッピング','旅行'],height:155, bust:88, waist:60, hip:88, url:'https://www.jfa.jp/national_team/staff/MORIYASU_Hajime.html' },
  { id:4, name:'板倉芽衣',  img:'panels/板倉芽衣.png',  tags:['筋トレ','アニメ','キャンプ','旅行','ショッピング'], height:167, bust:80, waist:56, hip:82, url:'https://www.japan-baseball.jp/jp/profile/201901003.html' },
  { id:5, name:'小林由奈',  img:'panels/小林由奈.png',  tags:['旅行','写真','カラオケ','読書'],      height:160, bust:84, waist:57, hip:85, url:'https://www.pokepara.jp/_hokkaido/m801/a1801/shop4072/gal/409983/' },
];

// ── Schedule dummy data (3/10 ~ 3/31) ────────────────────────
const schedule = { 1:{}, 2:{}, 3:{} };

(function seedSchedule() {
  // Patterns per shop — rotated daily so every day differs
  const patterns = {
    1: [[1,3,5],[2,4],[1,2,3],[3,4,5],[1,4],[2,3,5],[1,2],[4,5],[1,3],[2,3,4],[1,5],[2,4,5],[1,2,3,5],[3,4],[2,5],[1,4,5],[2,3],[1,3,4],[],[1,2,4,5],[3,5],[1,2]],
    2: [[2,5],[1,3],[4,5],[2,3],[1,4,5],[3,5],[1,2,4],[],[2,3,5],[1,4],[3,4,5],[1,2,3],[5],[2,4],[1,3,5],[2,3,4],[1],[4,5],[1,2,5],[3,4],[],[1,3,4]],
    3: [[3,4],[1,2,5],[],[3,5],[2,4],[1,3,4],[2,5],[1,4],[3,4,5],[1,2],[4],[2,3,5],[1,4,5],[3],[1,2,3],[5],[2,4,5],[1,3],[],[2,3,4],[1,5],[3,4,5]],
  };
  for (let day = 10; day <= 31; day++) {
    const dateStr = `2026-03-${String(day).padStart(2,'0')}`;
    const idx = day - 10;
    schedule[1][dateStr] = patterns[1][idx] || [];
    schedule[2][dateStr] = patterns[2][idx] || [];
    schedule[3][dateStr] = patterns[3][idx] || [];
  }
})();

// ── Helpers ───────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function offsetDate(base, days) {
  const d = new Date(base + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
}

// ── State ─────────────────────────────────────────────────────
let mode = 'guest';
let currentDate = todayStr();
let selectedTags = new Set();

function getShop()   { return document.getElementById('shop-select').value; }
function getOnDuty() { return schedule[getShop()][currentDate] || []; }

function updateDateDisplay() {
  document.getElementById('date-display').textContent = fmtDate(currentDate);
  document.getElementById('date-select').value = currentDate;
}
function shiftDate(delta) {
  currentDate = offsetDate(currentDate, delta);
  selectedTags = new Set();
  updateDateDisplay();
  render();
}
function openDatePicker() {
  const el = document.getElementById('date-select');
  el.style.pointerEvents = 'auto';
  el.showPicker ? el.showPicker() : el.click();
  el.style.pointerEvents = 'none';
}
function onDatePicked() {
  currentDate = document.getElementById('date-select').value;
  selectedTags = new Set();
  updateDateDisplay();
  render();
}

// ── Render helpers ────────────────────────────────────────────
function tagsHtml(s) {
  return s.tags.map(t => `<span class="tag">${t}</span>`).join('');
}

// ── Guest view ────────────────────────────────────────────────
function renderTagFilter(dutyStaff) {
  const allTags = [...new Set(dutyStaff.flatMap(s => s.tags))].sort();
  const bar = document.getElementById('tag-filter');
  bar.innerHTML = allTags.map(t =>
    `<button class="filter-tag ${selectedTags.has(t)?'active':''}" onclick="toggleTagFilter('${t}')">${t}</button>`
  ).join('');
}
function toggleTagFilter(tag) {
  if (selectedTags.has(tag)) selectedTags.delete(tag); else selectedTags.add(tag);
  renderGuest();
}

function renderGuest() {
  const dutyStaff = getOnDuty().map(id => staff.find(x => x.id === id)).filter(Boolean);
  renderTagFilter(dutyStaff);
  const grid = document.getElementById('guest-grid');

  if (!dutyStaff.length) {
    grid.innerHTML = '<div class="col-12"><p class="no-staff">出勤スタッフなし</p></div>';
    return;
  }

  const filtered = selectedTags.size ? dutyStaff.filter(s => [...selectedTags].every(t => s.tags.includes(t))) : dutyStaff;
  if (!filtered.length) {
    grid.innerHTML = '<div class="col-12"><p class="no-staff">該当スタッフなし</p></div>';
    return;
  }

  // col-6 (2 per row) on mobile, col-md-4 (3 per row) on tablet, col-lg-3 (4 per row) on desktop
  grid.innerHTML = filtered.map(s => `
    <div class="col-6 col-md-4 col-lg-3">
      <div class="staff-card">
        <div class="img-wrap ${s.url ? 'has-url' : ''}" ${s.url ? `onclick="window.open('${s.url}','_blank')"` : ''}>
          <img src="${s.img}" alt="${s.name}" onerror="this.style.background='#0f3460';this.style.height='150px'">
        </div>
        <div class="s-name">${s.name}</div>
        <div class="s-stats">
          <span>${s.height}cm</span>
          <span>B${s.bust} / W${s.waist} / H${s.hip}</span>
        </div>
        <div class="s-tags">${tagsHtml(s)}</div>
      </div>
    </div>`).join('');
}

// ── Admin view ────────────────────────────────────────────────
function renderAdmin() {
  const onDuty = getOnDuty();
  const list = document.getElementById('admin-list');
  // col-12 on mobile, col-md-6 (2 per row) on tablet+
  list.innerHTML = staff.map(s => {
    const sel = onDuty.includes(s.id);
    return `
    <div class="col-12 col-md-6">
      <div class="staff-row ${sel?'selected':''}" onclick="toggleStaff(${s.id})">
        <img src="${s.img}" alt="${s.name}" onerror="this.style.background='#0f3460'">
        <div class="r-info">
          <div class="r-name">${s.name}</div>
          <div class="r-tags">${tagsHtml(s)}</div>
        </div>
        <div class="check">${sel?'✓':''}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleStaff(id) {
  const shop = getShop();
  if (!schedule[shop][currentDate]) schedule[shop][currentDate] = [];
  const arr = schedule[shop][currentDate];
  const idx = arr.indexOf(id);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(id);
  renderAdmin();
}

// ── Common ────────────────────────────────────────────────────
function render() {
  if (mode === 'guest') renderGuest(); else renderAdmin();
}
function saveSchedule() { showToast('更新しました'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function setMode(m) {
  mode = m;
  document.getElementById('view-guest').style.display = m==='guest' ? '' : 'none';
  document.getElementById('view-admin').style.display = m==='admin' ? '' : 'none';
  document.getElementById('btn-guest').classList.toggle('active', m==='guest');
  document.getElementById('btn-admin').classList.toggle('active', m==='admin');
  render();
}

// ── Init ──────────────────────────────────────────────────────
updateDateDisplay();
render();
</script>
</body>
</html>
