<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出勤管理（管理者）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --accent:  #4fa8d8;
      --accent2: #7bc4a0;
      --bg:      #f0f7fb;
      --surface: #ffffff;
      --border:  #d4e8f5;
      --text:    #334e5e;
      --muted:   #8aabbe;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic ProN', sans-serif; }

    /* ── Login overlay ── */
    #login-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .login-box {
      background: #fff; border-radius: 14px; padding: 36px 32px;
      width: 90%; max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .login-box h2 { font-size: 1.05rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 22px; }
    .login-btn {
      width: 100%; padding: 12px; background: var(--accent);
      border: none; border-radius: 8px; color: #fff;
      font-size: 1rem; cursor: pointer; letter-spacing: 2px;
    }
    .login-btn:hover { opacity: .88; }

    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg, #e8f6ff, #d0edf8);
      border-bottom: 2px solid var(--accent);
      padding: 14px 20px;
    }
    .app-header h1 { font-size: 1.15rem; color: var(--accent); letter-spacing: 3px; margin: 0; }
    .back-link {
      padding: 5px 18px; border: 1.5px solid var(--muted); border-radius: 20px;
      background: transparent; color: var(--muted); font-size: 0.8rem;
      text-decoration: none; transition: all .2s;
    }
    .back-link:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Tab nav ── */
    .admin-tabs {
      display: flex; border-bottom: 2px solid var(--border);
      background: var(--surface); padding: 0 20px;
    }
    .admin-tab {
      padding: 12px 20px; font-size: 0.88rem; letter-spacing: 1.5px;
      border: none; background: none; color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s;
    }
    .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .admin-tab:hover:not(.active) { color: var(--text); }

    /* ── Controls ── */
    .ctrl-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; }
    .app-select {
      width: 100%; padding: 9px 14px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.95rem; appearance: none; cursor: pointer;
      box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .app-select:focus { outline: none; border-color: var(--accent); }
    .date-arrow {
      width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface); border: 1.5px solid var(--border); color: var(--muted);
      font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s; box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .date-arrow:hover { border-color: var(--accent); color: var(--accent); }
    .date-display {
      flex: 1; padding: 9px 14px; text-align: center;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; color: var(--text); cursor: pointer; user-select: none;
      box-shadow: 0 1px 4px rgba(79,168,216,.08);
    }
    .date-display:hover { border-color: var(--accent); }
    #date-select { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

    /* ── Staff row (attendance) ── */
    .section-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
    .staff-row {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; padding: 10px 14px; gap: 12px;
      cursor: pointer; transition: all .2s; height: 100%;
      box-shadow: 0 1px 6px rgba(79,168,216,.08);
    }
    .staff-row.selected { border-color: var(--accent); background: #e8f6ff; }
    .staff-row img { width: 44px; height: 74px; object-fit: cover; object-position: top; border-radius: 8px; flex-shrink: 0; background: #d0edf8; }
    .staff-row .r-info { flex: 1; min-width: 0; }
    .staff-row .r-name { font-size: 0.9rem; margin-bottom: 4px; color: var(--text); font-weight: 600; }
    .staff-row .check {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all .2s;
    }
    .staff-row.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Tags ── */
    .tag {
      font-size: 0.62rem; padding: 2px 7px; border-radius: 10px;
      background: rgba(123,196,160,.15); border: 1px solid rgba(123,196,160,.5); color: #3d9e76;
    }
    .r-tags { display: flex; flex-wrap: wrap; gap: 3px; }

    /* ── Misc ── */
    .update-btn {
      width: 100%; padding: 13px; margin-top: 16px;
      background: linear-gradient(135deg, var(--accent), #2d8abf);
      border: none; border-radius: 10px; color: #fff; font-size: 1rem;
      cursor: pointer; letter-spacing: 2px; transition: opacity .2s;
      box-shadow: 0 3px 12px rgba(79,168,216,.35);
    }
    .update-btn:hover { opacity: .88; }
    .toast-wrap {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: #fff; padding: 11px 26px; border-radius: 24px;
      font-size: 0.9rem; transition: transform .3s; pointer-events: none; z-index: 9999;
      box-shadow: 0 4px 16px rgba(79,168,216,.4);
    }
    .toast-wrap.show { transform: translateX(-50%) translateY(0); }

    /* ── Store management ── */
    .add-store-btn {
      padding: 9px 22px; background: var(--accent); border: none; border-radius: 8px;
      color: #fff; font-size: 0.88rem; cursor: pointer; letter-spacing: 1px; transition: opacity .2s;
    }
    .add-store-btn:hover { opacity: .88; }
    .store-mgmt-row {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 12px 16px; box-shadow: 0 1px 6px rgba(79,168,216,.08);
    }
    .store-mgmt-row .s-name { font-size: 0.9rem; color: var(--text); font-weight: 600; margin-bottom: 3px; }
    .store-mgmt-row .s-detail { font-size: 0.75rem; color: var(--muted); }

    /* ── Staff management ── */
    .add-staff-btn {
      padding: 9px 22px; background: var(--accent2); border: none; border-radius: 8px;
      color: #fff; font-size: 0.88rem; cursor: pointer; letter-spacing: 1px; transition: opacity .2s;
    }
    .add-staff-btn:hover { opacity: .88; }
    .mgmt-row {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
      display: flex; align-items: center; padding: 10px 14px; gap: 12px;
      box-shadow: 0 1px 6px rgba(79,168,216,.08);
    }
    .mgmt-row img {
      width: 44px; height: 74px; object-fit: cover; object-position: top;
      border-radius: 8px; flex-shrink: 0; background: #d0edf8;
    }
    .mgmt-row .r-info { flex: 1; min-width: 0; }
    .mgmt-row .r-name { font-size: 0.9rem; color: var(--text); font-weight: 600; margin-bottom: 3px; }
    .mgmt-row .r-spec { font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; }
    .mgmt-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-edit {
      padding: 5px 14px; font-size: 0.78rem; border-radius: 6px;
      border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
      cursor: pointer; transition: all .2s;
    }
    .btn-edit:hover { background: var(--accent); color: #fff; }
    .btn-del {
      padding: 5px 14px; font-size: 0.78rem; border-radius: 6px;
      border: 1.5px solid #e07070; background: transparent; color: #e07070;
      cursor: pointer; transition: all .2s;
    }
    .btn-del:hover { background: #e07070; color: #fff; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 8000;
      align-items: flex-start; justify-content: center;
      padding: 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 14px; padding: 28px 28px;
      width: 100%; max-width: 500px; margin: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal-box h3 { font-size: 1rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 20px; }
    .modal-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }
    .modal-input {
      width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.9rem; color: var(--text); background: var(--bg);
    }
    .modal-input:focus { outline: none; border-color: var(--accent); }
    .photo-preview {
      width: 60px; height: 100px; object-fit: cover; object-position: top;
      border-radius: 8px; background: #d0edf8; border: 1.5px solid var(--border);
    }
    .modal-save-btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent), #2d8abf);
      border: none; border-radius: 10px; color: #fff; font-size: 1rem;
      cursor: pointer; letter-spacing: 2px; transition: opacity .2s;
      box-shadow: 0 3px 12px rgba(79,168,216,.35);
    }
    .modal-save-btn:hover { opacity: .88; }
    .modal-cancel-btn {
      width: 100%; padding: 10px; background: transparent;
      border: 1.5px solid var(--border); border-radius: 10px; color: var(--muted);
      font-size: 0.9rem; cursor: pointer; letter-spacing: 1px; transition: all .2s; margin-top: 8px;
    }
    .modal-cancel-btn:hover { border-color: var(--muted); color: var(--text); }
  </style>
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay" style="display:none">
  <div class="login-box">
    <h2>管理者ログイン</h2>
    <div class="mb-3">
      <input type="email" id="login-email" class="form-control" placeholder="メールアドレス">
    </div>
    <div class="mb-3">
      <input type="password" id="login-password" class="form-control" placeholder="パスワード"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <p id="login-error" style="color:#e74c3c; font-size:0.82rem; min-height:1.2em; margin-bottom:12px;"></p>
    <button class="login-btn" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- Header -->
<div class="app-header d-flex align-items-center justify-content-between">
  <h1>✦ 出勤管理</h1>
  <a href="index.html" class="back-link">← 客用画面</a>
</div>

<!-- Tab nav -->
<div class="admin-tabs">
  <button class="admin-tab active" id="tab-btn-attendance" onclick="showTab('attendance')">出勤登録</button>
  <button class="admin-tab" id="tab-btn-staff" onclick="showTab('staff')">スタッフ管理</button>
  <button class="admin-tab" id="tab-btn-store" onclick="showTab('store')">店舗管理</button>
</div>

<!-- ── Tab: 出勤登録 ── -->
<div id="tab-attendance">
  <div class="container-lg py-4 px-3 px-md-4">
    <div class="row g-3 mb-3">
      <!-- Shop -->
      <div class="col-12 col-md-4">
        <div class="ctrl-label">SHOP</div>
        <select class="app-select" id="shop-select" onchange="loadAttendance()"></select>
      </div>
      <!-- Date -->
      <div class="col-12 col-md-8">
        <div class="ctrl-label">DATE</div>
        <div class="d-flex align-items-center gap-2">
          <button class="date-arrow" onclick="shiftDate(-1)">‹</button>
          <div class="date-display" onclick="openDatePicker()" id="date-display"></div>
          <button class="date-arrow" onclick="shiftDate(1)">›</button>
        </div>
        <input type="date" id="date-select" onchange="onDatePicked()">
      </div>
    </div>

    <div class="section-label">出勤スタッフ選択</div>
    <div class="row g-3" id="admin-list"></div>
    <button class="update-btn" onclick="saveSchedule()">更　新</button>
  </div>
</div>

<!-- ── Tab: スタッフ管理 ── -->
<div id="tab-staff" style="display:none">
  <div class="container-lg py-4 px-3 px-md-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="section-label mb-0">スタッフ一覧</div>
      <button class="add-staff-btn" onclick="openStaffModal()">＋ 新規追加</button>
    </div>
    <div class="d-flex flex-column gap-2" id="staff-mgmt-list"></div>
  </div>
</div>

<!-- ── Tab: 店舗管理 ── -->
<div id="tab-store" style="display:none">
  <div class="container-lg py-4 px-3 px-md-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="section-label mb-0">店舗一覧</div>
      <button class="add-store-btn" onclick="openStoreModal()">＋ 新規追加</button>
    </div>
    <div class="d-flex flex-column gap-2" id="store-mgmt-list"></div>
  </div>
</div>

<!-- ── Store modal ── -->
<div class="modal-overlay" id="store-modal">
  <div class="modal-box">
    <h3 id="store-modal-title">店舗登録</h3>

    <div class="mb-3">
      <div class="modal-label">店舗名 *</div>
      <input type="text" id="sm-name" class="modal-input" placeholder="店舗名">
    </div>
    <div class="mb-3">
      <div class="modal-label">住所</div>
      <input type="text" id="sm-address" class="modal-input" placeholder="東京都渋谷区...">
    </div>
    <div class="mb-3">
      <div class="modal-label">TEL</div>
      <input type="tel" id="sm-tel" class="modal-input" placeholder="03-0000-0000">
    </div>

    <div id="store-modal-error" style="color:#e74c3c; font-size:0.82rem; min-height:1.2em; margin-bottom:8px;"></div>
    <button class="modal-save-btn" onclick="saveStore()">保　存</button>
    <button class="modal-cancel-btn" onclick="closeStoreModal()">キャンセル</button>
  </div>
</div>

<!-- ── Staff modal ── -->
<div class="modal-overlay" id="staff-modal">
  <div class="modal-box">
    <h3 id="modal-title">スタッフ登録</h3>

    <div class="mb-3">
      <div class="modal-label">名前 *</div>
      <input type="text" id="m-name" class="modal-input" placeholder="氏名">
    </div>
    <div class="mb-3">
      <div class="modal-label">所属店舗</div>
      <select id="m-store-id" class="modal-input"></select>
    </div>
    <div class="mb-3">
      <div class="modal-label">プロフィールURL</div>
      <input type="url" id="m-profile-url" class="modal-input" placeholder="https://...">
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6 col-sm-3">
        <div class="modal-label">身長 (cm)</div>
        <input type="number" id="m-height" class="modal-input" placeholder="160">
      </div>
      <div class="col-6 col-sm-3">
        <div class="modal-label">バスト (cm)</div>
        <input type="number" id="m-bust" class="modal-input" placeholder="85">
      </div>
      <div class="col-6 col-sm-3">
        <div class="modal-label">ウエスト (cm)</div>
        <input type="number" id="m-waist" class="modal-input" placeholder="60">
      </div>
      <div class="col-6 col-sm-3">
        <div class="modal-label">ヒップ (cm)</div>
        <input type="number" id="m-hip" class="modal-input" placeholder="88">
      </div>
    </div>

    <div class="mb-3">
      <div class="modal-label">タグ（カンマ区切り）</div>
      <input type="text" id="m-tags" class="modal-input" placeholder="読書, 料理, 旅行">
    </div>

    <div class="mb-3">
      <div class="modal-label">写真</div>
      <div class="d-flex align-items-center gap-3">
        <img id="m-photo-preview" class="photo-preview" alt="preview">
        <div>
          <input type="file" id="m-photo" accept="image/*" onchange="previewPhoto(this)" style="display:none">
          <button type="button" class="btn-edit" onclick="document.getElementById('m-photo').click()">写真を選択</button>
          <div id="m-photo-name" style="font-size:0.72rem; color:var(--muted); margin-top:6px;"></div>
        </div>
      </div>
    </div>

    <div id="modal-save-error" style="color:#e74c3c; font-size:0.82rem; min-height:1.2em; margin-bottom:8px;"></div>
    <button class="modal-save-btn" onclick="saveStaff()">保　存</button>
    <button class="modal-cancel-btn" onclick="closeStaffModal()">キャンセル</button>
  </div>
</div>

<div class="toast-wrap" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────
let staffList = [];
let storeList = [];
let onDutyIds = new Set();
let currentDate = todayStr();
let editingStaffId = null;   // null = new, number = editing
let editingStoreId = null;   // null = new, number = editing

function getShop() { return document.getElementById('shop-select').value; }

// ── Init ──────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    const overlay = document.getElementById('login-overlay');
    overlay.style.display = 'flex';
    return;
  }
  await loadStores();
  await loadStaff();
  updateDateDisplay();
  await loadAttendance();
}

// ── Login ─────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').textContent = '';

  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('login-error').textContent = 'メールアドレスまたはパスワードが違います';
    return;
  }
  document.getElementById('login-overlay').style.display = 'none';
  await loadStores();
  await loadStaff();
  updateDateDisplay();
  await loadAttendance();
}

// ── Tab ───────────────────────────────────────────────────────
function showTab(tab) {
  document.getElementById('tab-attendance').style.display = tab === 'attendance' ? '' : 'none';
  document.getElementById('tab-staff').style.display      = tab === 'staff'      ? '' : 'none';
  document.getElementById('tab-store').style.display      = tab === 'store'      ? '' : 'none';
  document.getElementById('tab-btn-attendance').classList.toggle('active', tab === 'attendance');
  document.getElementById('tab-btn-staff').classList.toggle('active', tab === 'staff');
  document.getElementById('tab-btn-store').classList.toggle('active', tab === 'store');
  if (tab === 'staff') renderStaffMgmt();
  if (tab === 'store') renderStoreMgmt();
}

// ── Data loading ──────────────────────────────────────────────
async function loadStores() {
  const { data, error } = await db.from('stores').select('*').order('id');
  if (error) { console.error(error); return; }
  storeList = data;
  const sel = document.getElementById('shop-select');
  sel.innerHTML = data.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

async function loadStaff() {
  const { data, error } = await db.from('staff').select('*').order('id');
  if (error) { console.error(error); return; }
  staffList = data;
}

async function loadAttendance() {
  const storeId = getShop();
  if (!storeId) return;
  const { data, error } = await db.from('attendance')
    .select('staff_id')
    .eq('store_id', storeId)
    .eq('date', currentDate);
  if (error) { console.error(error); return; }
  onDutyIds = new Set((data || []).map(r => r.staff_id));
  render();
}

// ── Attendance render ──────────────────────────────────────────
function render() {
  const list = document.getElementById('admin-list');
  list.innerHTML = staffList.map(s => {
    const sel = onDutyIds.has(s.id);
    return `
    <div class="col-12 col-md-6">
      <div class="staff-row ${sel ? 'selected' : ''}" onclick="toggleStaff(${s.id})">
        <img src="${s.img_url || ''}" alt="${s.name}" onerror="this.removeAttribute('src')">
        <div class="r-info">
          <div class="r-name">${s.name}</div>
          <div class="r-tags">${tagsHtml(s)}</div>
        </div>
        <div class="check">${sel ? '✓' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleStaff(id) {
  if (onDutyIds.has(id)) onDutyIds.delete(id); else onDutyIds.add(id);
  render();
}

// ── Save attendance ────────────────────────────────────────────
async function saveSchedule() {
  const storeId = parseInt(getShop());
  const { error: delErr } = await db.from('attendance').delete()
    .eq('store_id', storeId)
    .eq('date', currentDate);
  if (delErr) { showToast('エラーが発生しました'); console.error(delErr); return; }

  if (onDutyIds.size > 0) {
    const rows = [...onDutyIds].map(id => ({ store_id: storeId, staff_id: id, date: currentDate }));
    const { error: insErr } = await db.from('attendance').insert(rows);
    if (insErr) { showToast('エラーが発生しました'); console.error(insErr); return; }
  }
  showToast('更新しました');
}

// ── Date ──────────────────────────────────────────────────────
function updateDateDisplay() {
  document.getElementById('date-display').textContent = fmtDate(currentDate);
  document.getElementById('date-select').value = currentDate;
}
function shiftDate(delta) {
  currentDate = offsetDate(currentDate, delta);
  updateDateDisplay();
  loadAttendance();
}
function openDatePicker() {
  const el = document.getElementById('date-select');
  el.style.pointerEvents = 'auto';
  el.showPicker ? el.showPicker() : el.click();
  el.style.pointerEvents = 'none';
}
function onDatePicked() {
  currentDate = document.getElementById('date-select').value;
  updateDateDisplay();
  loadAttendance();
}

// ── Staff management render ────────────────────────────────────
function renderStaffMgmt() {
  const list = document.getElementById('staff-mgmt-list');
  if (staffList.length === 0) {
    list.innerHTML = '<p style="color:var(--muted); font-size:0.88rem;">スタッフが登録されていません</p>';
    return;
  }
  list.innerHTML = staffList.map(s => {
    const spec = [s.height && `${s.height}cm`, s.bust && `B${s.bust}`, s.waist && `W${s.waist}`, s.hip && `H${s.hip}`]
      .filter(Boolean).join(' / ');
    const storeName = s.store_id ? (storeList.find(x => x.id === s.store_id)?.name || '') : '';
    return `
    <div class="mgmt-row">
      <img src="${s.img_url || ''}" alt="${s.name}" onerror="this.removeAttribute('src')">
      <div class="r-info">
        <div class="r-name">${s.name}</div>
        ${storeName ? `<div class="r-spec">${storeName}</div>` : ''}
        ${spec ? `<div class="r-spec">${spec}</div>` : ''}
        <div class="r-tags">${tagsHtml(s)}</div>
      </div>
      <div class="mgmt-actions">
        <button class="btn-edit" onclick="openStaffModal(${s.id})">編集</button>
        <button class="btn-del" onclick="deleteStaff(${s.id}, '${s.name.replace(/'/g, "\\'")}')">削除</button>
      </div>
    </div>`;
  }).join('');
}

// ── Staff modal ────────────────────────────────────────────────
function openStaffModal(staffId) {
  editingStaffId = staffId || null;
  document.getElementById('modal-title').textContent = staffId ? 'スタッフ編集' : 'スタッフ登録';
  document.getElementById('modal-save-error').textContent = '';

  const s = staffId ? staffList.find(x => x.id === staffId) : null;
  document.getElementById('m-name').value        = s?.name        || '';
  document.getElementById('m-profile-url').value = s?.profile_url || '';
  document.getElementById('m-height').value      = s?.height      ?? 160;
  document.getElementById('m-bust').value        = s?.bust        ?? 80;
  document.getElementById('m-waist').value       = s?.waist       ?? 50;
  document.getElementById('m-hip').value         = s?.hip         ?? 80;
  document.getElementById('m-tags').value        = (s?.tags || []).join(', ');
  document.getElementById('m-photo').value       = '';
  document.getElementById('m-photo-name').textContent = '';
  const preview = document.getElementById('m-photo-preview');
  preview.src = s?.img_url || '';
  if (!s?.img_url) preview.removeAttribute('src');

  // 店舗セレクト
  const storeSelect = document.getElementById('m-store-id');
  storeSelect.innerHTML = '<option value="">（未所属）</option>' +
    storeList.map(st => `<option value="${st.id}" ${s?.store_id === st.id ? 'selected' : ''}>${st.name}</option>`).join('');

  document.getElementById('staff-modal').classList.add('open');
}

function closeStaffModal() {
  document.getElementById('staff-modal').classList.remove('open');
}

function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('m-photo-name').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('m-photo-preview').src = e.target.result; };
  reader.readAsDataURL(file);
}

async function saveStaff() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) {
    document.getElementById('modal-save-error').textContent = '名前は必須です';
    return;
  }
  document.getElementById('modal-save-error').textContent = '';

  const storeIdVal = document.getElementById('m-store-id').value;
  const payload = {
    name,
    profile_url: document.getElementById('m-profile-url').value.trim() || null,
    height: parseInt(document.getElementById('m-height').value) || null,
    bust:   parseInt(document.getElementById('m-bust').value)   || null,
    waist:  parseInt(document.getElementById('m-waist').value)  || null,
    hip:    parseInt(document.getElementById('m-hip').value)    || null,
    tags:   document.getElementById('m-tags').value.split(',').map(t => t.trim()).filter(Boolean),
    store_id: storeIdVal ? parseInt(storeIdVal) : null,
  };

  // Photo upload
  const photoFile = document.getElementById('m-photo').files[0];
  if (photoFile) {
    const ext = photoFile.name.split('.').pop();
    const fileName = `${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await db.storage.from('panels').upload(fileName, photoFile, { upsert: true });
    if (upErr) {
      document.getElementById('modal-save-error').textContent = '写真のアップロードに失敗しました';
      console.error(upErr);
      return;
    }
    const { data: urlData } = db.storage.from('panels').getPublicUrl(fileName);
    payload.img_url = urlData.publicUrl;
  }

  if (editingStaffId) {
    const { error } = await db.from('staff').update(payload).eq('id', editingStaffId);
    if (error) { document.getElementById('modal-save-error').textContent = '保存に失敗しました'; console.error(error); return; }
  } else {
    const { error } = await db.from('staff').insert(payload);
    if (error) { document.getElementById('modal-save-error').textContent = '保存に失敗しました'; console.error(error); return; }
  }

  await loadStaff();
  renderStaffMgmt();
  render(); // refresh attendance list too
  closeStaffModal();
  showToast(editingStaffId ? '更新しました' : '登録しました');
}

async function deleteStaff(id, name) {
  if (!confirm(`「${name}」を削除しますか？\n関連する出勤データも削除されます。`)) return;
  const { error } = await db.from('staff').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました'); console.error(error); return; }
  await loadStaff();
  renderStaffMgmt();
  render();
  showToast('削除しました');
}

// ── Store management ──────────────────────────────────────────
function renderStoreMgmt() {
  const list = document.getElementById('store-mgmt-list');
  if (storeList.length === 0) {
    list.innerHTML = '<p style="color:var(--muted); font-size:0.88rem;">店舗が登録されていません</p>';
    return;
  }
  list.innerHTML = storeList.map(st => `
    <div class="store-mgmt-row d-flex align-items-center justify-content-between gap-3">
      <div>
        <div class="s-name">${st.name}</div>
        ${st.address ? `<div class="s-detail">${st.address}</div>` : ''}
        ${st.tel     ? `<div class="s-detail">${st.tel}</div>`     : ''}
      </div>
      <div class="mgmt-actions flex-shrink-0">
        <button class="btn-edit" onclick="openStoreModal(${st.id})">編集</button>
        <button class="btn-del" onclick="deleteStore(${st.id}, '${st.name.replace(/'/g, "\\'")}')">削除</button>
      </div>
    </div>`).join('');
}

function openStoreModal(storeId) {
  editingStoreId = storeId || null;
  document.getElementById('store-modal-title').textContent = storeId ? '店舗編集' : '店舗登録';
  document.getElementById('store-modal-error').textContent = '';

  const st = storeId ? storeList.find(x => x.id === storeId) : null;
  document.getElementById('sm-name').value    = st?.name    || '';
  document.getElementById('sm-address').value = st?.address || '';
  document.getElementById('sm-tel').value     = st?.tel     || '';

  document.getElementById('store-modal').classList.add('open');
}

function closeStoreModal() {
  document.getElementById('store-modal').classList.remove('open');
}

async function saveStore() {
  const name = document.getElementById('sm-name').value.trim();
  if (!name) {
    document.getElementById('store-modal-error').textContent = '店舗名は必須です';
    return;
  }
  document.getElementById('store-modal-error').textContent = '';

  const payload = {
    name,
    address: document.getElementById('sm-address').value.trim() || null,
    tel:     document.getElementById('sm-tel').value.trim()     || null,
  };

  if (editingStoreId) {
    const { error } = await db.from('stores').update(payload).eq('id', editingStoreId);
    if (error) { document.getElementById('store-modal-error').textContent = '保存に失敗しました'; console.error(error); return; }
  } else {
    const { error } = await db.from('stores').insert(payload);
    if (error) { document.getElementById('store-modal-error').textContent = '保存に失敗しました'; console.error(error); return; }
  }

  await loadStores();
  renderStoreMgmt();
  closeStoreModal();
  showToast(editingStoreId ? '更新しました' : '登録しました');
}

async function deleteStore(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const { error } = await db.from('stores').delete().eq('id', id);
  if (error) { showToast('削除に失敗しました'); console.error(error); return; }
  await loadStores();
  renderStoreMgmt();
  showToast('削除しました');
}

init();
